name: Publish Muse Glimmer worker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: blackwell-fix-20260813
      llama_cpp_ref:
        description: llama.cpp git tag
        required: true
        default: b10375
      cuda_architectures:
        description: CUDA architectures compiled into llama-server
        required: true
        default: '80;86;89;90;100;120'
      build_jobs:
        description: Parallel CUDA compiler jobs
        required: true
        default: '4'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/muse-glimmer-runpod

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out worker bundle
        uses: actions/checkout@v4

      - name: Free disposable runner disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          build-args: |
            LLAMA_CPP_REF=${{ inputs.llama_cpp_ref }}
            CUDA_ARCHITECTURES=${{ inputs.cuda_architectures }}
            BUILD_JOBS=${{ inputs.build_jobs }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Print immutable image reference
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ inputs.tag }}"

