name: Publish Muse Glimmer worker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: b10375
      build_jobs:
        description: Parallel CUDA compiler jobs
        required: true
        default: '4'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/muse-glimmer-runpod
  LLAMA_CPP_REF: b10375
  CUDA_ARCHITECTURES: 86;89;90

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out worker bundle
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          build-args: |
            LLAMA_CPP_REF=${{ env.LLAMA_CPP_REF }}
            CUDA_ARCHITECTURES=${{ env.CUDA_ARCHITECTURES }}
            BUILD_JOBS=${{ inputs.build_jobs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print immutable image reference
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ inputs.tag }}"
