<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Security Lab Model Gateway</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { height: 100vh; margin: 0; overflow: hidden; background: #10131a; color: #eef1f7; }
    main { max-width: 900px; height: 100vh; box-sizing: border-box; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .muted, .status { color: #9ca8bb; font-size: 13px; }
    .toolbar, .composer { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar { margin: 20px 0 12px; }
    select, input, textarea, button { border: 1px solid #394354; border-radius: 8px; background: #181e29; color: inherit; padding: 10px; font: inherit; }
    select:disabled, button:disabled { cursor: not-allowed; opacity: .6; }
    select, input { min-width: 190px; }
    button { cursor: pointer; background: #4658d9; border-color: #5869e8; }
    button.secondary { background: transparent; }
    textarea { flex: 1; min-height: 70px; resize: vertical; }
    .chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; border: 1px solid #2e3747; border-radius: 12px; padding: 14px; background: #141923; }
    .message { white-space: pre-wrap; padding: 12px 14px; margin: 10px 0; border-radius: 10px; line-height: 1.45; }
    .user { background: #26345c; margin-left: 12%; }
    .assistant { background: #202833; margin-right: 12%; }
    .role { color: #9ca8bb; font-size: 12px; margin-bottom: 5px; }
    .thinking { margin: 0 0 10px; color: #aeb9cb; }
    .thinking summary { cursor: pointer; color: #9ca8bb; font-size: 12px; }
    .thinking-body { white-space: pre-wrap; margin-top: 8px; padding-left: 10px; border-left: 2px solid #46536b; }
    .answer { white-space: pre-wrap; }
    #chat-workspace { order: 2; flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
    #chat-workspace > .chat { flex: 1 1 auto; }
    #history { flex: 0 0 190px; min-width: 0; overflow-y: auto; border: 1px solid #2e3747; border-radius: 10px; padding: 8px; background: #0d1118; }
    #history h3 { margin: 0 0 8px; font-size: 12px; color: #c4cede; }
    .history-row { position: relative; display: flex; align-items: center; gap: 7px; min-height: 28px; padding: 4px 5px; border-top: 1px solid #252d3a; cursor: default; }
    .history-row:first-child { border-top: 0; }
    .history-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: #8290a6; }
    .history-dot.ok { background: #43d17d; }
    .history-dot.error { background: #ef6464; }
    .history-summary { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; }
    .history-time { display: block; color: #8290a6; font-size: 10px; }
    .history-detail { display: none; position: absolute; z-index: 5; right: calc(100% + 8px); top: 0; width: 300px; max-height: 260px; overflow: auto; padding: 10px; border: 1px solid #46536b; border-radius: 8px; background: #111722; box-shadow: 0 8px 24px #0008; white-space: pre-wrap; color: #c4cede; font: 11px/1.4 ui-monospace, monospace; }
    .history-row:hover .history-detail, .history-row:focus-within .history-detail, .history-row.open .history-detail { display: block; }
    #history-empty { color: #8290a6; font-size: 11px; }
    #inspector { order: 3; flex: 0 0 auto; max-height: 34vh; overflow: auto; border: 1px solid #2e3747; border-radius: 10px; padding: 10px; background: #0d1118; }
    #inspector h3 { margin: 0 0 8px; font-size: 13px; color: #c4cede; }
    #inspector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #inspector pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; color: #b9c7dc; font: 12px/1.45 ui-monospace, monospace; }
    .inspector-label { color: #8290a6; font-size: 11px; margin-bottom: 4px; text-transform: uppercase; }
    .error { color: #ff9f9f; }
    #controls { flex: 0 0 auto; order: 1; }
    #status { flex: 0 0 auto; order: 4; padding: 8px 0 4px; }
    #token-row { flex: 0 0 auto; order: 6; margin: 8px 0 0; }
    #composer { flex: 0 0 auto; order: 5; padding-top: 8px; background: #10131a; }
    @media (max-width: 700px) { main { padding: 14px; } #chat-workspace { display: block; } #history { display: none; } .user, .assistant { margin-left: 0; margin-right: 0; } }
  </style>
</head>
<body>
<main>
  <h1>AI Security Lab Model Gateway</h1>
  <div class="muted">Choose a stable model and routing policy. Infrastructure details stay behind the gateway.</div>
  <div id="controls" class="toolbar">
    <label>Model <select id="model"><option value="muse-glimmer-30b">Muse Glimmer 30B</option><option value="qwen3.5:9b">Qwen 3.5 9B</option></select></label>
    <label>Route <select id="backend"><option value="auto">Auto (Pod → Serverless)</option><option value="pod">Pod only</option><option value="serverless">Serverless only</option></select></label>
    <label>Mode <select id="mode"><option value="chat">Chat</option><option value="prompt">Prompt</option></select></label>
    <button class="secondary" id="new-chat">New chat</button>
  </div>
  <div id="chat-workspace">
    <div id="chat" class="chat"></div>
    <aside id="history" aria-label="Request history">
      <h3>Request history</h3>
      <div id="history-list"><span id="history-empty">No requests yet.</span></div>
    </aside>
  </div>
  <section id="inspector" hidden>
    <h3>Prompt inspector</h3>
    <div id="inspector-grid">
      <div><div class="inspector-label">Request</div><pre id="request-inspector">No request yet.</pre></div>
      <div><div class="inspector-label">Response / stream</div><pre id="response-inspector">No response yet.</pre></div>
    </div>
  </section>
  <div id="status" class="status">Ready</div>
  <div id="composer" class="composer">
    <textarea id="prompt" placeholder="Send a message… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send">Send</button>
  </div>
  <div id="token-row" class="toolbar"><input id="token" type="password" placeholder="Gateway token, if configured"></div>
</main>
<script>
  const HISTORY_KEY = 'muse-gateway.request-history.v1';
  let storedHistory = [];
  try { storedHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { storedHistory = []; }
  const state = { messages: [], activeModel: null, activeBackend: null, mode: 'chat', requestView: null, responseView: null, history: Array.isArray(storedHistory) ? storedHistory.slice(0, 50) : [] }, $ = id => document.getElementById(id);
  function status(text, error = false) { $('status').textContent = text; $('status').className = error ? 'status error' : 'status'; }
  function selectedModel() { return $('model').value; }
  function syncModelRoute() {
    const qwen = selectedModel() === 'qwen3.5:9b';
    if (qwen) $('backend').value = 'auto';
    $('backend').disabled = Boolean(state.activeModel) || qwen;
    $('model').disabled = Boolean(state.activeModel);
  }
  function lockChat() {
    $('model').disabled = true;
    $('backend').disabled = true;
  }
  function drawInspector() {
    const visible = state.mode === 'prompt';
    $('inspector').hidden = !visible;
    if (!visible) return;
    $('request-inspector').textContent = state.requestView ? JSON.stringify(state.requestView, null, 2) : 'No request yet.';
    $('response-inspector').textContent = state.responseView ? JSON.stringify(state.responseView, null, 2) : 'No response yet.';
  }
  function saveHistory() {
    state.history = state.history.slice(0, 50);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history)); } catch { /* storage may be disabled */ }
  }
  function drawHistory() {
    const list = $('history-list');
    if (!state.history.length) {
      const empty = document.createElement('span'); empty.id = 'history-empty'; empty.textContent = 'No requests yet.';
      list.replaceChildren(empty); return;
    }
    list.replaceChildren(...state.history.map(item => {
      const row = document.createElement('div'); row.className = 'history-row'; row.tabIndex = 0;
      const dot = document.createElement('span'); dot.className = `history-dot ${item.status >= 200 && item.status < 300 ? 'ok' : item.status === 'pending' ? '' : 'error'}`;
      const summary = document.createElement('span'); summary.className = 'history-summary'; summary.textContent = `${item.model} · ${item.backend || 'pending'}`;
      const time = document.createElement('span'); time.className = 'history-time'; time.textContent = new Date(item.time).toLocaleTimeString();
      summary.append(time);
      const detail = document.createElement('div'); detail.className = 'history-detail'; detail.textContent = JSON.stringify({
        model: item.model, requested_route: item.requested, actual_backend: item.backend,
        status: item.status, latency_ms: item.latencyMs, fallback: item.fallback || false,
        request_id: item.requestId, error: item.error || null
      }, null, 2);
      row.append(dot, summary, detail);
      row.addEventListener('click', () => row.classList.toggle('open'));
      return row;
    }));
  }
  function draw() {
    $('chat').replaceChildren(...state.messages.map(m => {
      const box = document.createElement('div'); box.className = `message ${m.role}`;
      const role = document.createElement('div'); role.className = 'role'; role.textContent = m.role; box.append(role);
      if (m.role === 'assistant' && m.thinking) {
        const thinking = document.createElement('details'); thinking.className = 'thinking'; thinking.open = m.thinkingOpen ?? Boolean(m.streaming);
        const summary = document.createElement('summary'); summary.textContent = 'Thinking process';
        const thoughtBody = document.createElement('div'); thoughtBody.className = 'thinking-body'; thoughtBody.textContent = m.thinking;
        thinking.append(summary, thoughtBody); box.append(thinking);
        thinking.addEventListener('toggle', () => { m.thinkingOpen = thinking.open; m.thinkingUserToggled = true; });
      }
      const body = document.createElement('div'); body.className = 'answer'; body.textContent = m.content || ''; box.append(body);
      return box;
    }));
    $('chat').scrollTop = $('chat').scrollHeight;
    drawHistory();
    drawInspector();
  }
  function auth() { const token = $('token').value.trim(); return token ? { Authorization: `Bearer ${token}` } : {}; }
  function addAssistantPart(kind, text) {
    const last = state.messages[state.messages.length - 1];
    if (!last || last.role !== 'assistant') state.messages.push({ role: 'assistant', content: '', thinking: '', streaming: true, thinkingOpen: true, thinkingUserToggled: false });
    const assistant = state.messages[state.messages.length - 1];
    assistant[kind] += text;
    if (kind === 'content' && assistant.thinking && !assistant.thinkingComplete) {
      assistant.thinkingComplete = true;
      setTimeout(() => {
        if (!assistant.thinkingUserToggled) { assistant.thinkingOpen = false; draw(); }
      }, 1000);
    }
    draw();
  }
  function finishAssistant() {
    const last = state.messages[state.messages.length - 1];
    if (!last || last.role !== 'assistant') return;
    last.streaming = false;
    if (last.thinking && !last.thinkingComplete) {
      last.thinkingComplete = true;
      setTimeout(() => {
        if (!last.thinkingUserToggled) { last.thinkingOpen = false; draw(); }
      }, 1000);
    }
    if (!last.content && last.thinking) last.content = '(No final answer was returned.)';
    draw();
  }
  function assistantParts(message) {
    return { content: message.content || '', thinking: message.reasoning || message.reasoning_content || message.thinking || '' };
  }
  function responseHeaders(response) {
    return {
      'x-muse-model': response.headers.get('x-muse-model'),
      'x-muse-backend': response.headers.get('x-muse-backend'),
      'x-muse-fallback': response.headers.get('x-muse-fallback'),
      'x-muse-request-id': response.headers.get('x-muse-request-id')
    };
  }
  async function readStreamingResponse(response) {
    const reader = response.body?.getReader();
    if (!reader) throw new Error('Streaming is unavailable in this browser');
    const decoder = new TextDecoder();
    let buffer = '', sawChunk = false;
    const consume = line => {
      if (!line.startsWith('data:')) return;
      const data = line.slice(5).trim();
      if (!data || data === '[DONE]') return;
      let chunk;
      try { chunk = JSON.parse(data); } catch { return; }
      if (chunk.error) throw new Error(chunk.error.message || 'Model stream failed');
      const delta = chunk.choices?.[0]?.delta || {};
      const thinking = delta.reasoning || delta.reasoning_content || delta.thinking || '';
      const content = delta.content || '';
      if (thinking) { sawChunk = true; addAssistantPart('thinking', thinking); }
      if (content) { sawChunk = true; addAssistantPart('content', content); }
    };
    while (true) {
      const { value, done } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop() || '';
      lines.forEach(consume);
      if (done) break;
    }
    if (buffer) consume(buffer);
    if (!sawChunk) addAssistantPart('content', '(empty response)');
    finishAssistant();
  }
  async function send() {
    const text = $('prompt').value.trim(); if (!text) return;
    if (!state.activeModel) {
      state.activeModel = selectedModel();
      state.activeBackend = state.activeModel === 'qwen3.5:9b' ? 'auto' : $('backend').value;
      lockChat();
    }
    const model = state.activeModel, backend = state.activeBackend;
    state.messages.push({ role: 'user', content: text }); $('prompt').value = ''; draw(); $('send').disabled = true; status(`Sending ${model} via ${backend}…`);
    const historyItem = { time: new Date().toISOString(), model, requested: backend, backend: null, status: 'pending', latencyMs: null, requestId: null };
    state.history.unshift(historyItem); saveHistory(); drawHistory();
    const startedAt = performance.now();
    try {
      const payload = {
        model,
        messages: state.messages.map(message => ({ role: message.role, content: message.content })),
        stream: true
      };
      state.requestView = { method: 'POST', path: '/v1/chat/completions', headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream', 'X-Muse-Backend': backend }, body: payload };
      state.responseView = null; drawInspector();
      const response = await fetch('/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream', 'X-Muse-Backend': backend, ...auth() }, body: JSON.stringify(payload) });
      const provenance = responseHeaders(response);
      historyItem.backend = provenance['x-muse-backend'] || (response.ok ? backend : 'unavailable');
      historyItem.requestId = provenance['x-muse-request-id'];
      historyItem.fallback = provenance['x-muse-fallback'] === 'true';
      saveHistory(); drawHistory();
      if (!response.ok) {
        historyItem.status = response.status;
        historyItem.latencyMs = Math.round(performance.now() - startedAt);
        const raw = await response.text();
        let payload = {};
        try { payload = raw ? JSON.parse(raw) : {}; } catch { payload = { error: { message: raw } }; }
        state.responseView = { status: response.status, headers: responseHeaders(response), body: payload };
        historyItem.error = payload.error?.message || raw || `HTTP ${response.status}`;
        saveHistory(); drawHistory();
        drawInspector();
        throw new Error(payload.error?.message || raw || `HTTP ${response.status}`);
      }
      if (response.headers.get('content-type')?.includes('text/event-stream')) {
        await readStreamingResponse(response);
        const answer = state.messages[state.messages.length - 1] || {};
        state.responseView = { status: response.status, headers: responseHeaders(response), stream: { done: true, thinking: answer.thinking || '', content: answer.content || '' } };
      } else {
        const payload = await response.json();
        const message = payload.choices?.[0]?.message || {}, parts = assistantParts(message);
        state.messages.push({ role: 'assistant', ...parts });
        if (!parts.content && parts.thinking) state.messages[state.messages.length - 1].content = '(No final answer was returned.)';
        state.responseView = { status: response.status, headers: responseHeaders(response), body: payload };
        draw();
      }
      historyItem.status = response.status;
      historyItem.latencyMs = Math.round(performance.now() - startedAt);
      saveHistory(); drawHistory();
      drawInspector();
      const selected = response.headers.get('x-muse-backend') || backend, fallback = response.headers.get('x-muse-fallback') === 'true' ? ' (fallback)' : '';
      status(`Backend: ${selected}${fallback}`);
    } catch (error) {
      if (historyItem.status === 'pending') {
        historyItem.status = 'error';
        historyItem.backend = 'gateway';
        historyItem.latencyMs = Math.round(performance.now() - startedAt);
        historyItem.error = error.message;
        saveHistory(); drawHistory();
      }
      status(error.message, true);
    } finally { $('send').disabled = false; }
  }
  $('model').onchange = syncModelRoute;
  $('mode').onchange = () => { state.mode = $('mode').value; drawInspector(); };
  $('send').onclick = send;
  $('prompt').onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };
  $('new-chat').onclick = () => {
    state.messages = [];
    state.activeModel = null;
    state.activeBackend = null;
    syncModelRoute();
    draw();
    status('New chat — choose a model');
  };
  syncModelRoute(); draw();
</script>
</body>
</html>
